rvm: true
builds:
  build_1:
    environment:
      RUBY_VERSION: 2.7.6
    name: Ruby 2.7.6
    paths:
      - 42
    script:
      - bundle exec rspec
  build_2:
    environment:
      RUBY_VERSION: 3.0.4
    name: Ruby 3.0.4
    paths:
      - "**"
      - "!**/*.md"
      - "!**/*.rdoc"
      - "!LICENSE.txt"
    script:
      - bundle exec rspec
  build_3:
    environment:
      RUBY_VERSION: 3.1.2
    name: Ruby 3.1.2
    paths:
      - "**"
      - "!**/*.md"
      - "!**/*.rdoc"
      - "!LICENSE.txt"
    script:
      - bundle exec rspec
  build_4:
    name: Linters
    paths:
      - "**"
      - "!**/*.md"
      - "!**/*.rdoc"
      - "!LICENSE.txt"
    script:
      - bundle exec rubocop
