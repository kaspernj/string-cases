rvm: true
builds:
  build_1:
    environment:
      RUBY_VERSION: 2.7.6
    name: Ruby 2.7.6
    paths:
      - lib/**
      - spec/**
      - Gemfile
      - Gemfile.lock
      - Rakefile
      - peak_flow.yml
      - .ruby-version
      - string-cases.gemspec
    script:
      - bundle exec rspec
  build_2:
    environment:
      RUBY_VERSION: 3.0.4
    name: Ruby 3.0.4
    paths:
      - lib/**
      - spec/**
      - Gemfile
      - Gemfile.lock
      - Rakefile
      - peak_flow.yml
      - .ruby-version
      - string-cases.gemspec
    script:
      - bundle exec rspec
  build_3:
    environment:
      RUBY_VERSION: 3.1.2
    name: Ruby 3.1.2
    paths:
      - lib/**
      - spec/**
      - Gemfile
      - Gemfile.lock
      - Rakefile
      - peak_flow.yml
      - .ruby-version
      - string-cases.gemspec
    script:
      - bundle exec rspec
  build_4:
    name: Linters
    paths:
      - "**/*.rb"
      - lib/**
      - .rubocop.yml
      - Gemfile
      - Gemfile.lock
      - Rakefile
      - peak_flow.yml
      - .ruby-version
      - string-cases.gemspec
    script:
      - bundle exec rubocop
